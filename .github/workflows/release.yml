name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Needed to publish release notes and upload DMG assets

jobs:
  release-mac:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14 # Native Apple Silicon (M1/M2) GitHub runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync version from Git Tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Syncing release version to $VERSION"
          bun -e "
            const fs = require('fs');
            
            // 1. Update src-tauri/tauri.conf.json
            const tauriPath = 'src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            tauriConf.version = '$VERSION';
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2));

            // 2. Update package.json
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          "

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'UberMensch ${{ github.ref_name }}'
          releaseBody: 'See assets below to download the latest macOS installer.'
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
