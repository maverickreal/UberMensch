name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Needed to publish release notes and upload DMG assets

jobs:
  release-mac:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14 # Native Apple Silicon (M1/M2) GitHub runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync version from Git Tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Syncing release version to $VERSION"
          bun -e "
            const fs = require('fs');
            
            // 1. Update src-tauri/tauri.conf.json
            const tauriPath = 'src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            tauriConf.version = '$VERSION';
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2));

            // 2. Update package.json
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          "

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'UberMensch ${{ github.ref_name }}'
          releaseBody: 'See assets below to download the latest macOS installer.'
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Update Homebrew Cask in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          
          # 1. Locate the compiled DMG and compute its SHA-256
          DMG_PATH=$(find src-tauri/target -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::DMG file not found in build artifacts"
            exit 1
          fi
          
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "Release version: $VERSION"
          echo "DMG SHA-256: $SHA256"

          # 2. Clone homebrew-tap repository
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/maverickreal/homebrew-tap.git" tap-repo
          cd tap-repo

          # 3. Update version and sha256 inside Casks/ubermensch.rb
          node -e "
            const fs = require('fs');
            const caskPath = 'Casks/ubermensch.rb';
            let content = fs.readFileSync(caskPath, 'utf8');

            content = content.replace(/version \".*?\"/, 'version \"$VERSION\"');
            content = content.replace(/sha256 \".*?\"/, 'sha256 \"$SHA256\"');

            fs.writeFileSync(caskPath, content);
          "

          # 4. Commit and push changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ubermensch.rb
          git commit -m "chore(cask): bump ubermensch to v${VERSION}" || echo "No changes to commit"
          git push origin main
