<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UberMensch</title>
</head>
<body class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen flex flex-col justify-between p-6">
  
  <!-- Header / Controls Bar -->
  <header class="flex justify-between items-center max-w-xl w-full mx-auto">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
      <h1 class="text-sm font-bold tracking-wider uppercase text-zinc-800 dark:text-zinc-200">UberMensch</h1>
    </div>
    <button id="themeToggleBtn" class="p-2 rounded-lg border border-zinc-300 dark:border-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-900 transition-colors">
      <span id="themeIcon" class="text-sm">☀️</span>
    </button>
  </header>

  <!-- Main Timer Module -->
  <main class="max-w-xl w-full mx-auto space-y-6">
    
    <!-- Presets -->
    <div class="grid grid-cols-3 gap-2">
      <button data-preset="huberman" class="preset-btn py-2 px-3 text-xs font-medium rounded-lg border border-zinc-300 dark:border-zinc-800 hover:border-zinc-500 transition-colors">
        Huberman (90/20)
      </button>
      <button data-preset="pomodoro" class="preset-btn py-2 px-3 text-xs font-medium rounded-lg border border-zinc-300 dark:border-zinc-800 hover:border-zinc-500 transition-colors">
        Pomodoro (25/5)
      </button>
      <button data-preset="5217" class="preset-btn py-2 px-3 text-xs font-medium rounded-lg border border-zinc-300 dark:border-zinc-800 hover:border-zinc-500 transition-colors">
        Rule 52 / 17
      </button>
    </div>

    <!-- Parameter Adjusters -->
    <div class="grid grid-cols-3 gap-3 p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 shadow-sm">
      <label class="flex flex-col text-xs text-zinc-500 dark:text-zinc-400">
        Focus (min)
        <input id="workDurationInput" type="number" min="1" max="180" value="90" class="mt-1 p-2 rounded border border-zinc-200 dark:border-zinc-700 bg-transparent text-zinc-900 dark:text-zinc-100 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-zinc-500" />
      </label>
      <label class="flex flex-col text-xs text-zinc-500 dark:text-zinc-400">
        Break (min)
        <input id="breakDurationInput" type="number" min="1" max="60" value="20" class="mt-1 p-2 rounded border border-zinc-200 dark:border-zinc-700 bg-transparent text-zinc-900 dark:text-zinc-100 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-zinc-500" />
      </label>
      <label class="flex flex-col text-xs text-zinc-500 dark:text-zinc-400">
        Target Cycles
        <input id="cyclesInput" type="number" min="1" max="24" value="3" class="mt-1 p-2 rounded border border-zinc-200 dark:border-zinc-700 bg-transparent text-zinc-900 dark:text-zinc-100 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-zinc-500" />
      </label>
    </div>

    <!-- Countdown & State Display -->
    <div class="flex flex-col items-center justify-center p-8 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/40 relative overflow-hidden shadow-sm">
      <div id="progressBar" class="absolute bottom-0 left-0 h-1 bg-emerald-500 transition-all duration-300 w-0"></div>
      <div class="flex items-center gap-2 mb-2">
        <span id="phaseBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
          Focus
        </span>
        <span id="cycleTracker" class="text-xs text-zinc-500 font-mono">Cycle 1 / 3</span>
      </div>
      <div id="timerDisplay" class="text-7xl sm:text-8xl font-bold font-mono tracking-tighter my-2 tabular-nums">
        90:00
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center gap-3 mt-4">
        <button id="startPauseBtn" class="px-6 py-2.5 rounded-xl bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-medium text-sm hover:opacity-90 transition">
          Start Focus
        </button>
        <button id="skipBtn" class="px-4 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm hover:bg-zinc-200 dark:hover:bg-zinc-800 transition">
          Skip
        </button>
        <button id="resetBtn" class="px-4 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm hover:bg-zinc-200 dark:hover:bg-zinc-800 transition">
          Reset
        </button>
      </div>
    </div>

    <!-- Sound Control Section -->
    <div class="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 space-y-4 shadow-sm">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Audio Integration</span>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="autoPlayAudio" checked class="rounded border-zinc-300 text-zinc-900 focus:ring-0" />
          <label for="autoPlayAudio" class="text-xs text-zinc-600 dark:text-zinc-400">Play during focus only</label>
        </div>
      </div>

      <!-- Mode Selector -->
      <div class="flex gap-2 text-xs">
        <button id="sourceLocalBtn" class="flex-1 py-1.5 px-3 rounded-lg border border-zinc-400 dark:border-zinc-600 bg-zinc-200 dark:bg-zinc-800 font-medium transition-colors">
          Imported Tracks
        </button>
        <button id="sourceYtBtn" class="flex-1 py-1.5 px-3 rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-200 transition-colors">
          YouTube Stream
        </button>
      </div>

      <!-- Local Imported Audio Panel -->
      <div id="localAudioContainer" class="space-y-3">
        <div class="flex items-center gap-2">
          <select id="audioTrackSelect" class="flex-1 p-2 text-xs rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 focus:outline-none focus:ring-1 focus:ring-zinc-500 truncate">
            <option value="" disabled selected>No audio files imported</option>
          </select>

          <button id="deleteTrackBtn" title="Delete selected track" class="p-2 text-xs rounded-lg border border-zinc-200 dark:border-zinc-700 hover:bg-rose-500/10 hover:border-rose-500 text-zinc-400 hover:text-rose-500 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            ✕
          </button>

          <label for="audioFileInput" class="cursor-pointer py-2 px-3 text-xs font-medium rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 hover:opacity-90 transition whitespace-nowrap">
            + Import File
          </label>
          <input id="audioFileInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" class="hidden" />
        </div>
        <p id="audioFileMeta" class="text-[10px] text-zinc-400">Upload audio files (.mp3, .wav, .m4a, etc.). Stored permanently in your browser.</p>
      </div>

      <!-- YouTube Stream Panel -->
      <div id="ytInputContainer" class="hidden space-y-3">
        <!-- Add URL Form -->
        <div class="flex items-center gap-2">
          <input id="ytUrlInput" type="url" placeholder="Paste YouTube link (e.g. https://www.youtube.com/watch?v=...)" class="flex-1 p-2 text-xs rounded-lg border border-zinc-200 dark:border-zinc-700 bg-transparent text-zinc-900 dark:text-zinc-100 focus:outline-none focus:ring-1 focus:ring-zinc-500" />
          <button id="addYtBtn" class="py-2 px-3 text-xs font-medium rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 hover:opacity-90 transition whitespace-nowrap">
            + Save Stream
          </button>
        </div>

        <!-- Saved Streams Select + Delete -->
        <div class="flex items-center gap-2">
          <select id="ytStreamSelect" class="flex-1 p-2 text-xs rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 focus:outline-none focus:ring-1 focus:ring-zinc-500 truncate">
            <option value="" disabled selected>No saved YouTube streams</option>
          </select>
          <button id="deleteYtBtn" title="Delete selected stream" class="p-2 text-xs rounded-lg border border-zinc-200 dark:border-zinc-700 hover:bg-rose-500/10 hover:border-rose-500 text-zinc-400 hover:text-rose-500 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            ✕
          </button>
        </div>

        <!-- YouTube Stream Metadata Card -->
        <div id="ytInfoCard" class="hidden p-3 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/40 flex items-center gap-3">
          <img id="ytThumb" src="" alt="Thumbnail" class="w-16 h-12 rounded object-cover border border-zinc-300 dark:border-zinc-700 bg-zinc-800 shrink-0" />
          <div class="min-w-0 flex-1">
            <h4 id="ytTitle" class="text-xs font-semibold text-zinc-900 dark:text-zinc-100 truncate">Title</h4>
            <p id="ytAuthor" class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate">Channel</p>
            <div class="flex items-center gap-2 mt-1">
              <span id="ytIdTag" class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-zinc-200 dark:bg-zinc-700 text-zinc-600 dark:text-zinc-300">ID</span>
              <a id="ytExternalLink" href="#" target="_blank" rel="noreferrer" class="text-[10px] text-blue-500 hover:underline">Open on YouTube ↗</a>
            </div>
          </div>
        </div>

        <p id="ytStatusMeta" class="text-[10px] text-zinc-400">Pasted streams are saved locally with metadata for quick switching.</p>
      </div>

      <!-- Volume -->
      <div class="flex items-center gap-3 pt-1">
        <span class="text-xs text-zinc-500">Volume</span>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.8" class="w-full accent-zinc-900 dark:accent-zinc-100" />
      </div>
    </div>
  </main>

  <footer class="text-center text-[11px] text-zinc-400 mt-6">
    UberMensch • High Performance Focus Tracker
  </footer>

  <!-- Hidden Audio Interfaces -->
  <audio id="localAudioPlayer" loop></audio>
  <div id="ytPlayerContainer" class="hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
